# Owned by magic-mouse-wayland-gestures. install.sh and uninstall.sh manage only
# this uniquely named file and never overwrite a generic hid-magicmouse config.
# Pointer movement and physical buttons stay in the kernel. Userspace owns only
# scroll and gestures; center-zone middle click remains kernel-native.
options hid_magicmouse scroll_acceleration=0 scroll_speed=22 emulate_scroll_wheel=0 emulate_3button=1
